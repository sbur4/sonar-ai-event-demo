# ══════════════════════════════════════════════════════
# Gradle JVM & Build Performance
# ══════════════════════════════════════════════════════
org.gradle.jvmargs=-Xmx2048m -Xms512m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.configuration-cache=true

# ══════════════════════════════════════════════════════
# Java Toolchain
# ══════════════════════════════════════════════════════
org.gradle.java.home.auto=true

# ══════════════════════════════════════════════════════
# Spring Boot
# ══════════════════════════════════════════════════════
springBootVersion=4.1.0-M4
springDependencyManagementVersion=1.1.7

# ══════════════════════════════════════════════════════
# Configure GraalVM Native Image options (optional)
# ══════════════════════════════════════════════════════
org.graalvm.nativeimage.options=--no-fallback
